name: Build and test
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: backend/go.sum
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run version:check && npm run format:check && npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test ./... -count=1 -timeout=5m
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - if: runner.os == 'Linux'
        run: go test -race ./... -count=1 -timeout=5m
        working-directory: backend
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: backend
      - run: go build -trimpath ./cmd/castorice
        working-directory: backend
      - if: runner.os == 'Windows'
        run: node frontend/node_modules/playwright-core/cli.js install chromium firefox webkit
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CASTORICE_TEST_BROWSER = node --input-type=module -e "import { chromium } from './frontend/node_modules/playwright-core/index.mjs'; console.log(chromium.executablePath())"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $env:CASTORICE_TEST_BROWSER -PathType Leaf)) { throw 'Missing pinned Chromium for capture tests' }
          node scripts/verify-local.mjs msedge firefox webkit
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -SkipInstall -SkipTests
  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.apparmor.yaml
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: sudo apparmor_parser -r deploy/castorice-browser.apparmor
      - run: docker compose up -d --build
      - shell: bash
        run: |
          timeout 25 bash -c 'until docker compose exec -T analyzer test -s /data/access-password; do sleep 1; done'
          docker compose exec -T analyzer cat /proc/self/attr/current | grep -F 'castorice-browser (enforce)'
          docker compose exec -T analyzer cat /data/access-password | python scripts/smoke.py --access-password-file - --check-compose-sandbox
      - if: failure()
        run: docker compose logs analyzer
      - if: always()
        run: docker compose down -v
