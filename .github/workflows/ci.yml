name: Build and test
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test ./... -count=1 -timeout=5m
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go build -trimpath ./cmd/castorice
        working-directory: backend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t castorice-webruleanalyzer:ci .
      - run: docker run -d --name castorice-ci -p 127.0.0.1:19110:19110 --security-opt seccomp=unconfined --security-opt apparmor=unconfined --shm-size=256m castorice-webruleanalyzer:ci
      - run: python scripts/smoke.py --base-url http://127.0.0.1:19110
      - if: failure()
        run: docker logs castorice-ci
