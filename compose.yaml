name: castorice-webruleanalyzer
services:
  analyzer:
    build: .
    init: true
    ports:
      - "127.0.0.1:${CASTORICE_PORT:-19110}:19110"
    command: ["--public-url", "http://127.0.0.1:${CASTORICE_PORT:-19110}"]
    volumes:
      - analyzer-data:/data
    shm_size: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/castorice-seccomp.json
    restart: unless-stopped
volumes:
  analyzer-data:
